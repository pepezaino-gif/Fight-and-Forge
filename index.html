<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadow Forge RPG</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>

    <div id="game-container">
        
        <!-- HEADER STATISTICHE & VALUTE -->
        <header class="top-bar">
            <div class="user-info">
                <div class="avatar-frame">
                    <img src="https://img.icons8.com/fantasy-monsters/512/knight-head.png" alt="Avatar" class="avatar-img">
                </div>
                <div class="user-details">
                    <span id="player-name">Eroe</span>
                    <span id="player-power"><img src="https://img.icons8.com/fantasy-monsters/512/crossed-swords.png" class="mini-icon"> <span id="stat-power">0</span></span>
                </div>
            </div>
            <div class="currencies">
                <div class="currency"><img src="https://img.icons8.com/fantasy-monsters/512/gold-bars.png" class="curr-icon"> <span id="currency-gold">0</span></div>
                <div class="currency"><img src="https://img.icons8.com/fantasy-monsters/512/ruby.png" class="curr-icon"> <span id="currency-gems">0</span></div>
            </div>
        </header>

        <!-- AREA BATTAGLIA REALISTICA -->
        <section class="battle-stage">
            <div class="stage-info">
                <span id="stage-name">STAGE 1-1</span>
                <div class="wave-bar-container">
                    <div id="wave-progress" class="wave-bar"></div>
                </div>
            </div>

            <!-- Arena di Combattimento HD -->
            <div class="battle-arena">
                <div id="hero-character" class="character hero">
                    <div class="hp-bar-container"><div id="hero-hp" class="hp-bar"></div></div>
                    <img src="https://img.icons8.com/fantasy-monsters/512/paladin.png" class="character-img" alt="Eroe">
                </div>
                
                <div class="vs-badge">VS</div>

                <div id="enemy-character" class="character enemy">
                    <div class="hp-bar-container"><div id="enemy-hp" class="hp-bar"></div></div>
                    <img src="https://img.icons8.com/fantasy-monsters/512/orc-head.png" class="character-img" alt="Nemico">
                </div>
            </div>
        </section>

        <!-- SEZIONE PRINCIPALE DINAMICA -->
        <main class="main-content">
            
            <!-- TAB FORGIA ED EQUIPAGGIAMENTO -->
            <div id="tab-forge" class="tab-panel active">
                
                <!-- Griglia Equipaggiamento Ornata -->
                <div class="equipment-grid">
                    <div class="equip-slot" data-slot="weapon">
                        <img src="https://img.icons8.com/fantasy-monsters/512/longsword.png" class="slot-placeholder">
                    </div>
                    <div class="equip-slot" data-slot="helmet">
                        <img src="https://img.icons8.com/fantasy-monsters/512/viking-helmet.png" class="slot-placeholder">
                    </div>
                    <div class="equip-slot" data-slot="chest">
                        <img src="https://img.icons8.com/fantasy-monsters/512/body-armor.png" class="slot-placeholder">
                    </div>
                    <div class="equip-slot" data-slot="boots">
                        <img src="https://img.icons8.com/fantasy-monsters/512/steel-boots.png" class="slot-placeholder">
                    </div>
                    <div class="equip-slot" data-slot="ring">
                        <img src="https://img.icons8.com/fantasy-monsters/512/magic-ring.png" class="slot-placeholder">
                    </div>
                    <div class="equip-slot" data-slot="amulet">
                        <img src="https://img.icons8.com/fantasy-monsters/512/pendant.png" class="slot-placeholder">
                    </div>
                </div>

                <!-- Area della Forgia HD -->
                <div class="forge-area">
                    <div class="forge-level-tag">LIV. FORGIA <span id="forge-level">1</span></div>
                    
                    <div class="anvil-display">
                        <div class="forge-glow"></div>
                        <img src="https://img.icons8.com/fantasy-monsters/512/anvil.png" class="anvil-img">
                        <img src="https://img.icons8.com/fantasy-monsters/512/blacksmith.png" id="forge-hammer" class="hammer-img">
                    </div>
                    
                    <div class="forge-actions">
                        <button id="btn-forge" class="btn-primary btn-forge">
                            <span class="btn-title">FORGIA</span>
                            <small class="btn-cost"><img src="https://img.icons8.com/fantasy-monsters/512/gold-bars.png" class="cost-icon"> <span id="forge-cost">50</span></small>
                        </button>
                        <button id="btn-autoforge" class="btn-secondary">AUTO</button>
                    </div>
                </div>

            </div>

            <!-- TAB TECH TREE -->
            <div id="tab-tech" class="tab-panel">
                <div class="tech-header">
                    <h2>ALBERO TECNOLOGICO</h2>
                    <p>Sblocca antichi poteri per il tuo impero</p>
                </div>
                <div id="tech-tree-container" class="tech-tree"></div>
            </div>

            <!-- TAB CLASSIFICA -->
            <div id="tab-rank" class="tab-panel">
                <div class="rank-header">
                    <h2>LEGA ORO</h2>
                    <small>Stagione in corso</small>
                </div>
                <div class="leaderboard-list">
                    <div class="rank-item my-rank">
                        <span class="rank-num">#1</span>
                        <span class="player-name">Tu (Eroe)</span>
                        <span class="player-score">⚔️ 1.2M</span>
                    </div>
                </div>
            </div>

        </main>

        <!-- NAVIGAZIONE IN BASSO -->
        <nav class="bottom-nav">
            <button class="nav-btn active" onclick="switchTab('forge')">
                <img src="https://img.icons8.com/fantasy-monsters/512/anvil.png" class="nav-img">
                <span class="nav-label">Forgia</span>
            </button>
            <button class="nav-btn" onclick="switchTab('tech')">
                <img src="https://img.icons8.com/fantasy-monsters/512/tree-structure.png" class="nav-img">
                <span class="nav-label">Tech Tree</span>
            </button>
            <button class="nav-btn" onclick="switchTab('rank')">
                <img src="https://img.icons8.com/fantasy-monsters/512/trophy.png" class="nav-img">
                <span class="nav-label">Lega</span>
            </button>
        </nav>

    </div>

    <script src="state.js"></script>
    <script src="combat.js"></script>
    <script src="techTree.js"></script>
</body>
</html>
